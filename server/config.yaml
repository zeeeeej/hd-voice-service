# 全部路径相对 models_dir；models_dir 可被环境变量 VOICE_MODELS_DIR 覆盖
models_dir: /opt/voice/models

server:
  host: 0.0.0.0
  port: 8090

asr:
  encoder: streaming-zipformer-zh-int8-2025-06-30/encoder.int8.onnx
  decoder: streaming-zipformer-zh-int8-2025-06-30/decoder.onnx
  joiner: streaming-zipformer-zh-int8-2025-06-30/joiner.int8.onnx
  tokens: streaming-zipformer-zh-int8-2025-06-30/tokens.txt
  num_threads: 2
  language: zh
  # 端点兜底（VAD 为主，recognizer 端点为兜底）
  rule1_min_trailing_silence: 2.4
  rule2_min_trailing_silence: 1.2
  rule3_min_utterance_length: 20.0

denoiser:
  gtcrn_model: gtcrn_simple.onnx
  num_threads: 1

vad:
  model: silero_vad.onnx
  threshold: 0.5
  min_silence: 0.5
  min_speech: 0.25
  max_speech: 20.0
  window_size: 512
  sample_rate: 16000
  num_threads: 1
  buffer_seconds: 60

tts:
  engine: melo              # melo | aishell3 | matcha | kokoro | qwen3（推荐中文，需 Qwen sidecar）
  num_threads: 4
  default_speakers:
    melo: 0
    aishell3: 0
    matcha: 0
    kokoro: 3
    qwen3: Vivian
  default_speed: 1.0
  sample_rate_choices: [16000, 24000]
  # --- kokoro ---
  model: kokoro-int8-multi-lang-v1_1/model.int8.onnx
  lexicon: kokoro-int8-multi-lang-v1_1/lexicon-zh.txt,kokoro-int8-multi-lang-v1_1/lexicon-us-en.txt
  tokens: kokoro-int8-multi-lang-v1_1/tokens.txt
  data_dir: kokoro-int8-multi-lang-v1_1/espeak-ng-data
  dict_dir: ""  # sherpa-onnx >=1.12.15 无需 dict_dir
  voices: kokoro-int8-multi-lang-v1_1/voices.bin
  rule_fsts: kokoro-int8-multi-lang-v1_1/date-zh.fst,kokoro-int8-multi-lang-v1_1/number-zh.fst,kokoro-int8-multi-lang-v1_1/phone-zh.fst
  # --- matcha（engine: matcha 时生效）---
  matcha_model: matcha-icefall-zh-baker/model-steps-3.onnx
  matcha_lexicon: matcha-icefall-zh-baker/lexicon.txt
  matcha_tokens: matcha-icefall-zh-baker/tokens.txt
  matcha_dict_dir: matcha-icefall-zh-baker/dict
  matcha_data_dir: ""       # 留空复用 kokoro 的 espeak-ng-data
  matcha_vocoder: vocos-22khz-univ.onnx
  matcha_rule_fsts: matcha-icefall-zh-baker/date.fst,matcha-icefall-zh-baker/number.fst,matcha-icefall-zh-baker/phone.fst
  matcha_noise_scale: 0.667
  matcha_length_scale: 1.0
  # --- MeloTTS 中文（单音色，44.1kHz，MIT，可商用）---
  melo_model: vits-melo-tts-zh_en/model.onnx
  melo_lexicon: vits-melo-tts-zh_en/lexicon.txt
  melo_tokens: vits-melo-tts-zh_en/tokens.txt
  melo_rule_fsts: vits-melo-tts-zh_en/date.fst,vits-melo-tts-zh_en/number.fst,vits-melo-tts-zh_en/phone.fst
  # --- AISHELL3 VITS（纯中文 174 音色，原生 8kHz，Apache-2.0）---
  aishell3_model: vits-icefall-zh-aishell3/model.onnx
  aishell3_lexicon: vits-icefall-zh-aishell3/lexicon.txt
  aishell3_tokens: vits-icefall-zh-aishell3/tokens.txt
  aishell3_rule_fsts: vits-icefall-zh-aishell3/phone.fst,vits-icefall-zh-aishell3/date.fst,vits-icefall-zh-aishell3/number.fst
  vits_noise_scale: 0.667
  vits_noise_scale_w: 0.8
  vits_length_scale: 1.0
  # --- Qwen3-TTS 0.6B CustomVoice（独立容器，中文默认 Vivian）---
  qwen_url: http://qwen-tts:8091
  qwen_model: Qwen3-TTS-12Hz-0.6B-CustomVoice
  qwen_timeout: 300
  qwen_max_chars: 300
  qwen_speakers: [Vivian, Serena, Uncle_Fu, Dylan, Eric, Ryan, Aiden, Ono_Anna, Sohee]

# v2 句末精修（SenseVoice int8 + ct-transformer 标点 + ITN）
# 模型缺失或 enabled=false 时服务照常启动，final 自动回退流式文本（refined=false）
refine:
  enabled: true
  sense_voice_model: sense-voice-zh-en-ja-ko-yue-2024-07-17/model.int8.onnx
  sense_voice_tokens: sense-voice-zh-en-ja-ko-yue-2024-07-17/tokens.txt
  use_itn: true
  language: auto
  punct_model: punct-ct-transformer-zh-en-vocab272727-2024-04-12/model.onnx
  num_threads: 2

# 全局推理 provider：cpu | cuda（gpu-fp16 profile，须同时换 fp16/fp32 权重）| coreml（本机实测无收益）
provider: cpu

limits:
  asr_sessions: 32
  tts_sessions: 4
  idle_timeout: 60
  max_session: 300
  max_upload_mb: 25

defaults:
  denoise: false
  refine: true
  punctuate: true
