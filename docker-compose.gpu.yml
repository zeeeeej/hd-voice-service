# gpu-fp16 profile（生产 NVIDIA 机器用；⚠️ 待实机验证）
# 前置：宿主机装 NVIDIA 驱动 + nvidia-container-toolkit
# 用法：
#   ./scripts/download_models.sh --gpu        # 下载 fp16/fp32 权重（~1.7GB）
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  voice:
    build:
      context: ./server
      args:
        REQUIREMENTS: requirements-gpu.txt   # sherpa-onnx CUDA wheel
        PIP_INDEX_URL: ""
    image: hd-voice-service:gpu
    gpus: all
    volumes:
      - ./models:/opt/voice/models:ro
      - ./server/config-gpu.yaml:/opt/voice/config.yaml:ro
    environment:
      VOICE_API_KEY: ${VOICE_API_KEY:-devkey-local}
      VOICE_CONFIG: /opt/voice/config.yaml
      VOICE_MODELS_DIR: /opt/voice/models
      VOICE_TTS_ENGINE: ${VOICE_TTS_ENGINE:-melo}
    mem_limit: 8g
    # 注意：冒烟阈值届时收紧回 800ms：cli/smoke_test.py --max-first-chunk-ms 800
